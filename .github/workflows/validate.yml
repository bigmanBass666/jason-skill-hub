name: Validate Skill Index

on:
  push:
    branches: [master]
    paths:
      - 'skills/**'
      - 'scripts/**'
  pull_request:
    branches: [master]
    paths:
      - 'skills/**'
      - 'scripts/**'

# validate.yml 只做验证，不做 auto-fix。
# auto-fix/commit/push/CDN-purge 由 auto-fix-index.yml 处理，
# 避免两个 workflow 同时 push 导致竞争条件。
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run scan.js
        run: node scripts/scan.js

      - name: Check if index files need update
        id: check_changes
        run: |
          if git diff --quiet SKILLS_INDEX.md _redirects; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "diff<<EOF" >> $GITHUB_OUTPUT
            git diff SKILLS_INDEX.md _redirects >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Fail if index files out of date (PR only)
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.changed == 'true'
        run: |
          echo "❌ Index files are out of date. Run 'node scripts/scan.js' and commit the changes."
          git diff SKILLS_INDEX.md _redirects
          exit 1

      - name: Warn if index files out of date (push only)
        if: github.event_name == 'push' && steps.check_changes.outputs.changed == 'true'
        run: |
          echo "⚠️  Index files out of date — auto-fix-index.yml should handle this."
          echo "If you see this warning repeatedly, check auto-fix-index.yml."

      - name: ✅ Index files are up to date
        if: steps.check_changes.outputs.changed == 'false'
        run: echo "✅ All index files are up to date"